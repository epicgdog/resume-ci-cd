services:
  resume-gui:
    build: .
    container_name: resume-editor
    environment:
      - VIEWER_PASSWORD=${VIEWER_PASSWORD}
      - EDITOR_PASSWORD=${EDITOR_PASSWORD}
    ports:
      - "8080:80"
    volumes:
      - resume-data:/data

    networks:
      - default
      - npm_default

networks:
  npm_default:
    external: true

volumes:
  resume-data:
