server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /resume.md {
        auth_basic "Resume Editor";
        auth_basic_user_file /etc/nginx/.htpasswd-viewer;

        limit_except GET {
            auth_basic "Editor access";
            auth_basic_user_file /etc/nginx/.htpasswd-editor;
        }

        alias /data/resume.md;
        dav_methods PUT;
        create_full_put_path on;
    }

    location / {
        auth_basic "Resume Editor";
        auth_basic_user_file /etc/nginx/.htpasswd-viewer;
        try_files $uri $uri/ /index.html;
    }
}
